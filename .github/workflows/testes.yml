# Roda os testes a cada push e em cada PR. O :motor:test também valida todo
# JSON do catálogo: uma espécie quebrada derruba o CI, não o celular.
# O APK não sai daqui: o release é assinado com a chave de debug do PC, e um
# APK assinado no CI não instalaria por cima do que está no celular.
name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    # Fixo: o ubuntu-latest muda para o 26 em 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # O runner já traz o Android SDK (ANDROID_HOME), então o app compila sem
      # local.properties.
      - name: Testes do motor e do app
        run: ./gradlew :motor:test :app:testDebugUnitTest --console=plain

      - name: Relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: |
            motor/build/reports/tests/
            app/build/reports/tests/
            hs_err_pid*.log
